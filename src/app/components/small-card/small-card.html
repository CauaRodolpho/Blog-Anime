<article class="flex items-center gap-5 bg-slate-900/80 hover:bg-slate-800/90 p-4 rounded-2xl border border-slate-800/90 hover:border-amber-500/40 transition-all duration-300 group cursor-pointer shadow-md hover:shadow-lg">


  <div class="w-28 h-28 rounded-xl overflow-hidden shrink-0 border border-slate-700/50">
    <img
      [src]="imageUrl()"
      [alt]="title()"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
    >
  </div>


  <div class="flex flex-col justify-between h-full py-1">
    <div>
      <span class="text-xs font-bold uppercase tracking-wider text-amber-400">
       {{title()}}
      </span>
      <h3 class="text-base font-semibold text-slate-100 group-hover:text-amber-400 transition-colors line-clamp-2 mt-1 leading-snug">
        {{description()}}
      </h3>
    </div>

    <div class="flex items-center gap-2 mt-3 text-xs text-slate-400">
      <span>{{date()}}</span>
      <span>•</span>
      <span class="text-amber-500/90 font-medium hover:underline">Ler mais →</span>
    </div>
  </div>

</article>
